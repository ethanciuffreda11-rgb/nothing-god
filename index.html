<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nothing — God</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="top">
    <p class="eyebrow">God only</p>
    <h1>Nothing</h1>
    <p class="lead">You crashed the universes into one place. Choose the lobby you are inside. When they think it is finished, you send the next world. The last fight is you.</p>
  </header>

  <main>
    <div class="list-head">
      <h2>Live lobbies</h2>
      <p id="status" class="status">Looking for games…</p>
    </div>
    <ul id="lobbies" class="lobbies"></ul>
  </main>

  <aside id="picked" class="picked" hidden>
    <p class="picked-kicker">You are the boss here</p>
    <p id="picked-name" class="picked-name"></p>
    <p id="picked-detail" class="picked-detail"></p>
  </aside>

  <script src="god.js"></script>
</body>
</html>
