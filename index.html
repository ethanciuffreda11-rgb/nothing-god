<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nothing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="top">
    <p class="eyebrow">Monster AIs</p>
    <h1>Nothing</h1>
    <p class="lead">The minds stay on this site. Each one is controlling a body in a game somewhere else.</p>
  </header>

  <main>
    <div class="list-head">
      <h2>Minds here</h2>
      <p id="status" class="status">Looking for minds…</p>
    </div>
    <ul id="lobbies" class="lobbies"></ul>
  </main>

  <aside id="picked" class="picked" hidden>
    <p class="picked-kicker">Mind is here. Body is elsewhere.</p>
    <p id="picked-name" class="picked-name"></p>
    <p id="picked-detail" class="picked-detail"></p>
  </aside>

  <script src="god.js"></script>
</body>
</html>
